<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bản Đồ Những Khoảnh Khắc Xanh</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:ital,wght@0,600;1,600&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#5B9BFF',
                        secondary: '#A5D8FF',
                        accent: '#E0F7FA',
                        textDark: '#1A2A44',
                        textGray: '#64748B',
                        pinkLight: '#FFD6E0',
                        yellowLight: '#FFF3C4',
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        serif: ['Playfair Display', 'serif'],
                    }
                }
            }
        }
    </script>

    <!-- Custom Styles -->
    <style>
        body {
            background: linear-gradient(135deg, #E0F2FE 0%, #BAE6FD 50%, #7DD3FC 100%);
            min-height: 100vh;
            margin: 0;
            overflow-x: hidden;
        }
        
        .glass-card {
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.4);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.05);
        }

        .bubble-card { transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); cursor: pointer; }
        .bubble-card:hover {
            transform: scale(1.03) translateY(-5px);
            box-shadow: 0 20px 40px rgba(91, 155, 255, 0.15);
            border-color: rgba(91, 155, 255, 0.3);
        }

        .start-bubble {
            background: radial-gradient(circle at 30% 30%, rgba(255, 255, 255, 0.9), rgba(255, 255, 255, 0.2));
            box-shadow: inset 0 0 20px rgba(255,255,255,0.8), 0 0 20px rgba(255,255,255,0.4), 0 15px 30px rgba(91, 155, 255, 0.4);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255,255,255,0.6);
            animation: floatBubble 3s ease-in-out infinite;
        }

        @keyframes floatBubble {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-15px) scale(1.05); }
        }

        /* Modal transitions */
        .modal-enter { opacity: 0; transform: scale(0.95) translateY(10px); }
        .modal-enter-active { opacity: 1; transform: scale(1) translateY(0); transition: all 0.3s ease-out; }
        .modal-leave { opacity: 1; transform: scale(1) translateY(0); }
        .modal-leave-active { opacity: 0; transform: scale(0.95) translateY(10px); transition: all 0.2s ease-in; }

        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #A5D8FF; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #5B9BFF; }
        .no-scroll { overflow: hidden; height: 100vh; }
        
        .star { cursor: pointer; color: #cbd5e1; transition: color 0.2s; }
        .star.active { color: #fbbf24; }
        .star-view { color: #cbd5e1; }
        .star-view.active { color: #fbbf24; }
    </style>
</head>
<body class="text-textDark antialiased no-scroll" id="body">

    <!-- ================= INTRO SCREEN ================= -->
    <div id="intro-screen" class="fixed inset-0 z-[100] flex items-center justify-center bg-[#E0F2FE] transition-all duration-1000 ease-in-out">
        <video id="bg-video" class="absolute inset-0 w-full h-full object-cover transition-opacity duration-1000" muted playsinline autoplay>
            <source src="nenweb.mp4" type="video/mp4">
        </video>
        <div class="absolute inset-0 bg-black/10"></div>
        <button id="start-btn" class="start-bubble relative z-10 w-40 h-40 rounded-full flex flex-col items-center justify-center gap-2 cursor-pointer transition-all duration-700 scale-0 opacity-0 group">
            <span class="font-serif text-2xl font-bold text-primary drop-shadow-sm group-hover:text-[#4FC3F7] transition-colors">Mở ra</span>
            <svg class="w-6 h-6 text-primary group-hover:text-[#4FC3F7]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 14l-7 7m0 0l-7-7m7 7V3"></path>
            </svg>
        </button>
    </div>

    <!-- ================= MAIN CONTENT ================= -->
    <div id="main-content" class="opacity-0 transition-opacity duration-1000 ease-in-out pb-20">
        <header class="max-w-4xl mx-auto pt-16 px-6 text-center">
            <div class="inline-block mb-4 px-4 py-1.5 rounded-full glass-card text-primary font-medium text-sm flex items-center gap-2 w-max mx-auto">
                <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M3.172 5.172a4 4 0 015.656 0L10 6.343l1.172-1.171a4 4 0 115.656 5.656L10 17.657l-6.828-6.829a4 4 0 010-5.656z" clip-rule="evenodd"></path></svg>
                Nhật ký Date của tụi mình
            </div>
            <h1 class="font-serif text-4xl md:text-5xl font-semibold mb-4 text-textDark">
                Bản đồ những <br/> <span class="text-primary italic">khoảnh khắc xanh</span>
            </h1>
            <p class="text-textGray mb-8 max-w-lg mx-auto font-sans leading-relaxed">
                Lưu giữ từng góc phố, từng món ngon và những ngày thong thả đi dạo cùng em bé Mỹ Mỹ ☁️
            </p>
            <button onclick="openFormModal()" class="bg-primary hover:bg-[#4FC3F7] text-white px-8 py-3 rounded-full font-medium transition-all transform hover:scale-105 shadow-lg shadow-primary/30 flex items-center gap-2 mx-auto">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
                Thêm địa điểm mới
            </button>
        </header>

        <main id="places-grid" class="max-w-5xl mx-auto mt-12 px-6 grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- Render động bằng JS -->
        </main>
    </div>

    <!-- ================= MODAL XEM CHI TIẾT ================= -->
    <div id="view-modal-overlay" class="fixed inset-0 bg-textDark/40 backdrop-blur-sm z-[200] hidden items-center justify-center p-4">
        <div id="view-modal-content" class="bg-white rounded-3xl w-full max-w-md overflow-hidden shadow-2xl modal-enter relative">
            <button onclick="closeViewModal()" class="absolute top-4 right-4 z-10 p-2 bg-black/20 text-white backdrop-blur-md rounded-full hover:bg-black/40 transition-colors">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
            </button>

            <!-- Ảnh bìa lớn -->
            <div class="h-56 bg-gray-200 w-full relative">
                <img id="view-image" src="" alt="" class="w-full h-full object-cover">
                <div id="view-status-badge" class="absolute bottom-4 left-4 bg-white/90 backdrop-blur-sm px-3 py-1 rounded-full text-sm font-semibold flex items-center gap-1 shadow-sm">
                    <!-- Trạng thái (Đã đi/Sẽ đi) update bằng JS -->
                </div>
            </div>

            <div class="p-6">
                <div class="flex justify-between items-start mb-2">
                    <h2 id="view-name" class="text-2xl font-serif font-bold text-textDark">Tên địa điểm</h2>
                </div>
                
                <p id="view-address" class="text-sm text-textGray flex items-center gap-1 mb-4">
                    <svg class="w-4 h-4 text-primary" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"></path></svg>
                    <span>Địa chỉ chi tiết</span>
                </p>

                <div class="bg-accent/30 rounded-2xl p-4 mb-6">
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <p class="text-xs text-textGray mb-1">Loại hình</p>
                            <p id="view-type" class="font-medium text-sm text-textDark">Nhà hàng</p>
                        </div>
                        <div>
                            <p class="text-xs text-textGray mb-1" id="view-extra-label">Hình thức / Giá</p>
                            <p id="view-extra-value" class="font-medium text-sm text-textDark">Ăn tại chỗ</p>
                        </div>
                        <div class="col-span-2">
                            <p class="text-xs text-textGray mb-1">Đánh giá của tụi mình</p>
                            <div class="flex items-center gap-1" id="view-stars">
                                <!-- Stars render by JS -->
                            </div>
                        </div>
                    </div>
                </div>

                <div class="flex gap-3">
                    <button onclick="editCurrentPlace()" class="flex-1 py-2.5 rounded-xl bg-primary/10 text-primary hover:bg-primary/20 font-medium transition-colors flex items-center justify-center gap-2">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path></svg>
                        Chỉnh sửa
                    </button>
                    <button onclick="deleteCurrentPlace()" class="py-2.5 px-4 rounded-xl bg-red-50 text-red-500 hover:bg-red-100 font-medium transition-colors">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- ================= MODAL THÊM / SỬA ĐỊA ĐIỂM ================= -->
    <div id="form-modal-overlay" class="fixed inset-0 bg-textDark/40 backdrop-blur-sm z-[200] hidden items-center justify-center p-4">
        <div id="form-modal-content" class="bg-white rounded-3xl w-full max-w-lg overflow-hidden shadow-2xl modal-enter relative">
            <button onclick="closeFormModal()" class="absolute top-4 right-4 p-2 bg-gray-100 rounded-full hover:bg-gray-200 transition-colors">
                <svg class="w-5 h-5 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
            </button>

            <div class="p-6">
                <h2 id="form-title" class="text-2xl font-serif font-bold text-textDark mb-4">Lưu lại một kỷ niệm ☁️</h2>
                
                <div class="flex p-1 bg-gray-100 rounded-xl mb-6">
                    <button id="tab-food" onclick="switchTab('food')" class="flex-1 py-2 rounded-lg bg-white shadow-sm font-medium text-primary text-sm transition-all">Ăn uống</button>
                    <button id="tab-homestay" onclick="switchTab('homestay')" class="flex-1 py-2 rounded-lg text-textGray font-medium text-sm hover:text-primary transition-all">Homestay / Net</button>
                </div>

                <form id="add-form" onsubmit="handleFormSubmit(event)" class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Tên địa điểm *</label>
                        <input type="text" id="input-name" required class="w-full px-4 py-2.5 rounded-xl border border-gray-200 focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/20">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Địa chỉ</label>
                        <input type="text" id="input-address" class="w-full px-4 py-2.5 rounded-xl border border-gray-200 focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/20">
                    </div>

                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Đã đi chưa?</label>
                            <select id="input-visited" onchange="toggleRating()" class="w-full px-4 py-2.5 rounded-xl border border-gray-200 focus:outline-none focus:border-primary">
                                <option value="true">Đi rồi</option>
                                <option value="false">Chưa đi</option>
                            </select>
                        </div>
                        <div id="rating-container">
                            <label class="block text-sm font-medium text-gray-700 mb-1">Đánh giá</label>
                            <div class="flex items-center gap-1 mt-2" id="star-group">
                                <svg onclick="setRating(1)" class="w-6 h-6 star active" fill="currentColor" viewBox="0 0 20 20"><path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"></path></svg>
                                <svg onclick="setRating(2)" class="w-6 h-6 star active" fill="currentColor" viewBox="0 0 20 20"><path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"></path></svg>
                                <svg onclick="setRating(3)" class="w-6 h-6 star active" fill="currentColor" viewBox="0 0 20 20"><path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"></path></svg>
                                <svg onclick="setRating(4)" class="w-6 h-6 star active" fill="currentColor" viewBox="0 0 20 20"><path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"></path></svg>
                                <svg onclick="setRating(5)" class="w-6 h-6 star" fill="currentColor" viewBox="0 0 20 20"><path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"></path></svg>
                            </div>
                        </div>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Link hình ảnh (Lấy dòng Liên kết trực tiếp)</label>
                        <input type="url" id="input-image" placeholder="https://i.postimg.cc/..." class="w-full px-4 py-2.5 rounded-xl border border-gray-200 focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/20">
                    </div>

                    <!-- Fields for Food -->
                    <div id="form-food-fields" class="space-y-4">
                        <div class="grid grid-cols-2 gap-4">
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-1">Loại</label>
                                <select id="input-food-type" class="w-full px-4 py-2.5 rounded-xl border border-gray-200">
                                    <option value="Lề đường">Lề đường</option>
                                    <option value="Nhà hàng">Nhà hàng</option>
                                    <option value="Quán Cà Phê">Quán Cà Phê</option>
                                </select>
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-1">Hình thức</label>
                                <select id="input-format" class="w-full px-4 py-2.5 rounded-xl border border-gray-200">
                                    <option value="Ăn tại chỗ">Ăn tại chỗ</option>
                                    <option value="Mang đi">Mang đi</option>
                                    <option value="Cả hai">Cả hai</option>
                                </select>
                            </div>
                        </div>
                    </div>

                    <!-- Fields for Homestay -->
                    <div id="form-homestay-fields" class="space-y-4 hidden">
                        <div class="grid grid-cols-2 gap-4">
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-1">Loại</label>
                                <select id="input-home-type" class="w-full px-4 py-2.5 rounded-xl border border-gray-200">
                                    <option value="Homestay">Homestay</option>
                                    <option value="Phòng Net">Phòng Net</option>
                                </select>
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-1">Giá / Đêm / Giờ</label>
                                <input type="text" id="input-price" placeholder="VD: 500k/đêm" class="w-full px-4 py-2.5 rounded-xl border border-gray-200">
                            </div>
                        </div>
                    </div>

                    <button type="submit" id="btn-submit" class="w-full mt-4 bg-primary hover:bg-[#4FC3F7] text-white py-3 rounded-xl font-medium transition-colors shadow-lg shadow-primary/20">
                        Lưu vào Bản Đồ
                    </button>
                </form>
            </div>
        </div>
    </div>

    <script>
        // --- INTRO SCREEN LOGIC ---
        document.addEventListener('DOMContentLoaded', () => {
            const video = document.getElementById('bg-video');
            const startBtn = document.getElementById('start-btn');
            const introScreen = document.getElementById('intro-screen');
            const mainContent = document.getElementById('main-content');
            const body = document.getElementById('body');

            video.addEventListener('ended', showStartBubble);
            video.addEventListener('error', showStartBubble);
            
            function showStartBubble() {
                startBtn.classList.remove('scale-0', 'opacity-0');
                startBtn.classList.add('scale-100', 'opacity-100');
            }

            startBtn.addEventListener('click', () => {
                startBtn.style.animation = 'none';
                startBtn.classList.replace('scale-100', 'scale-150');
                startBtn.classList.replace('opacity-100', 'opacity-0');
                
                setTimeout(() => {
                    introScreen.style.opacity = '0';
                    setTimeout(() => {
                        introScreen.style.display = 'none';
                        body.classList.remove('no-scroll');
                        mainContent.classList.remove('opacity-0');
                        mainContent.classList.add('opacity-100');
                    }, 1000);
                }, 300);
            });

            loadPlaces();
        });

        // --- DATA STATE ---
        let places = [];
        let currentTab = 'food';
        let currentRating = 4;
        let editingId = null; // Biến cờ theo dõi xem đang Sửa hay Thêm mới
        let viewingId = null; // Biến cờ theo dõi xem đang Xem địa điểm nào

        function loadPlaces() {
            const savedData = localStorage.getItem('myDatesDataV2');
            if (savedData) {
                places = JSON.parse(savedData);
            }
            renderPlaces();
        }

        function savePlaces() {
            localStorage.setItem('myDatesDataV2', JSON.stringify(places));
        }

        // --- RENDER GIAO DIỆN CHÍNH ---
        function renderPlaces() {
            const grid = document.getElementById('places-grid');
            grid.innerHTML = ''; 

            const reversedPlaces = [...places].reverse(); 

            reversedPlaces.forEach(place => {
                let starsHtml = '';
                if (place.visited) {
                    for(let i=1; i<=5; i++) {
                        starsHtml += `<svg class="w-3.5 h-3.5 ${i <= place.rating ? 'text-yellow-400' : 'text-gray-300'}" fill="currentColor" viewBox="0 0 20 20"><path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"></path></svg>`;
                    }
                } else {
                    starsHtml = `<span class="text-xs text-gray-400 font-medium italic">Chưa đi</span>`;
                }

                let extraInfoHtml = '';
                if(place.category === 'food') {
                    extraInfoHtml = `
                        <span class="bg-gray-100 text-gray-600 px-2 py-0.5 rounded-md text-xs font-medium">${place.type}</span>
                        <span class="bg-blue-50 text-primary px-2 py-0.5 rounded-md text-xs font-medium">${place.format}</span>
                    `;
                } else {
                    extraInfoHtml = `
                        <span class="bg-purple-50 text-purple-600 px-2 py-0.5 rounded-md text-xs font-medium">${place.type}</span>
                    `;
                }
                
                const defaultImage = place.category === 'food' 
                    ? 'https://images.unsplash.com/photo-1517248135467-4c7edcad34c4?ixlib=rb-4.0.3&auto=format&fit=crop&w=800&q=80'
                    : 'https://images.unsplash.com/photo-1522708323590-d24dbb6b0267?ixlib=rb-4.0.3&auto=format&fit=crop&w=800&q=80';

                // Thêm sự kiện onclick="openViewModal(place.id)" cho Card
                const cardHtml = `
                    <article onclick="openViewModal(${place.id})" class="glass-card rounded-3xl p-4 bubble-card group relative overflow-hidden flex flex-col">
                        <div class="h-48 rounded-2xl bg-gray-200 overflow-hidden relative mb-4 shrink-0">
                            <img src="${place.image || defaultImage}" alt="${place.name}" class="w-full h-full object-cover group-hover:scale-110 transition-transform duration-700">
                            <div class="absolute top-3 left-3 bg-white/90 backdrop-blur-sm px-3 py-1 rounded-full text-xs font-semibold ${place.visited ? 'text-[#10B981]' : 'text-primary'} flex items-center gap-1 shadow-sm">
                                <span class="w-2 h-2 rounded-full ${place.visited ? 'bg-[#10B981]' : 'bg-primary'}"></span> 
                                ${place.visited ? 'Đã đi' : 'Sẽ đi'}
                            </div>
                        </div>
                        <div class="px-2 flex-1 flex flex-col">
                            <h3 class="font-serif text-xl font-semibold text-textDark leading-tight mb-1">${place.name}</h3>
                            <p class="text-sm text-textGray flex items-center gap-1 mb-2 truncate">
                                <svg class="w-3.5 h-3.5 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"></path></svg>
                                ${place.address || 'Chưa cập nhật'}
                            </p>
                            
                            <div class="flex items-center gap-2 mb-3 mt-auto">
                                ${extraInfoHtml}
                            </div>
                            
                            <div class="flex justify-between items-center bg-white/50 p-2.5 rounded-xl border border-white">
                                <div class="flex gap-1 items-center">
                                    ${starsHtml}
                                </div>
                            </div>
                        </div>
                    </article>
                `;
                grid.innerHTML += cardHtml;
            });
        }

        // --- MODAL XEM CHI TIẾT ĐỊA ĐIỂM ---
        function openViewModal(id) {
            const place = places.find(p => p.id === id);
            if(!place) return;
            viewingId = id; // Lưu lại ID đang xem

            document.getElementById('view-name').innerText = place.name;
            document.getElementById('view-address').innerHTML = `<svg class="w-4 h-4 text-primary shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"></path></svg> <span>${place.address || 'Chưa cập nhật địa chỉ'}</span>`;
            
            const defaultImage = place.category === 'food' 
                ? 'https://images.unsplash.com/photo-1517248135467-4c7edcad34c4?ixlib=rb-4.0.3&auto=format&fit=crop&w=800&q=80'
                : 'https://images.unsplash.com/photo-1522708323590-d24dbb6b0267?ixlib=rb-4.0.3&auto=format&fit=crop&w=800&q=80';
            document.getElementById('view-image').src = place.image || defaultImage;

            const badge = document.getElementById('view-status-badge');
            if (place.visited) {
                badge.innerHTML = `<span class="w-2 h-2 rounded-full bg-[#10B981]"></span><span class="text-[#10B981]">Đã đi</span>`;
            } else {
                badge.innerHTML = `<span class="w-2 h-2 rounded-full bg-primary"></span><span class="text-primary">Sẽ đi</span>`;
            }

            document.getElementById('view-type').innerText = place.type;
            
            if (place.category === 'food') {
                document.getElementById('view-extra-label').innerText = "Hình thức";
                document.getElementById('view-extra-value').innerText = place.format;
            } else {
                document.getElementById('view-extra-label').innerText = "Mức giá";
                document.getElementById('view-extra-value').innerText = place.price || 'Chưa có thông tin';
            }

            // Render Stars cho view
            let starsHtml = '';
            if (place.visited) {
                for(let i=1; i<=5; i++) {
                    starsHtml += `<svg class="w-5 h-5 ${i <= place.rating ? 'text-yellow-400' : 'text-gray-200'}" fill="currentColor" viewBox="0 0 20 20"><path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"></path></svg>`;
                }
            } else {
                starsHtml = `<span class="text-sm text-gray-400 italic">Chưa có đánh giá</span>`;
            }
            document.getElementById('view-stars').innerHTML = starsHtml;

            // Hiển thị modal
            const overlay = document.getElementById('view-modal-overlay');
            const content = document.getElementById('view-modal-content');
            overlay.classList.remove('hidden');
            overlay.classList.add('flex');
            content.classList.remove('modal-leave', 'modal-leave-active');
            content.classList.add('modal-enter', 'modal-enter-active');
            setTimeout(() => { content.classList.remove('modal-enter', 'modal-enter-active'); }, 300);
        }

        function closeViewModal() {
            const overlay = document.getElementById('view-modal-overlay');
            const content = document.getElementById('view-modal-content');
            content.classList.add('modal-leave-active');
            setTimeout(() => {
                overlay.classList.add('hidden');
                overlay.classList.remove('flex');
                content.classList.remove('modal-leave-active');
                viewingId = null;
            }, 200);
        }

        // --- NÚT CHỈNH SỬA & XÓA TRONG VIEW MODAL ---
        function editCurrentPlace() {
            const place = places.find(p => p.id === viewingId);
            if(!place) return;
            
            closeViewModal(); // Đóng form xem

            // Đặt biến cờ sang chế độ sửa
            editingId = place.id; 
            document.getElementById('form-title').innerText = "Chỉnh sửa kỷ niệm ✏️";
            document.getElementById('btn-submit').innerText = "Cập nhật";

            // Điền dữ liệu cũ vào Form
            switchTab(place.category);
            document.getElementById('input-name').value = place.name;
            document.getElementById('input-address').value = place.address;
            document.getElementById('input-image').value = place.image;
            document.getElementById('input-visited').value = place.visited ? "true" : "false";
            
            if (place.category === 'food') {
                document.getElementById('input-food-type').value = place.type;
                document.getElementById('input-format').value = place.format;
            } else {
                document.getElementById('input-home-type').value = place.type;
                document.getElementById('input-price').value = place.price;
            }

            toggleRating();
            if(place.visited) setRating(place.rating);

            // Mở form modal chậm một nhịp cho mượt
            setTimeout(() => {
                openFormModalOnlyUI();
            }, 300);
        }

        function deleteCurrentPlace() {
            if(confirm("Bạn có chắc muốn xóa kỷ niệm này không?")) {
                places = places.filter(p => p.id !== viewingId);
                savePlaces();
                renderPlaces();
                closeViewModal();
            }
        }

        // --- MODAL THÊM / SỬA LOGIC UI ---
        function openFormModal() {
            // Khi nhấn nút "Thêm mới" ở ngoài trang chủ -> Reset form
            editingId = null;
            document.getElementById('add-form').reset();
            document.getElementById('form-title').innerText = "Lưu lại một kỷ niệm ☁️";
            document.getElementById('btn-submit').innerText = "Lưu vào Bản Đồ";
            switchTab('food');
            setRating(4); 
            toggleRating();
            openFormModalOnlyUI();
        }

        function openFormModalOnlyUI() {
            const overlay = document.getElementById('form-modal-overlay');
            const content = document.getElementById('form-modal-content');
            overlay.classList.remove('hidden');
            overlay.classList.add('flex');
            content.classList.remove('modal-leave', 'modal-leave-active');
            content.classList.add('modal-enter', 'modal-enter-active');
            setTimeout(() => { content.classList.remove('modal-enter', 'modal-enter-active'); }, 300);
        }

        function closeFormModal() {
            const overlay = document.getElementById('form-modal-overlay');
            const content = document.getElementById('form-modal-content');
            content.classList.add('modal-leave-active');
            setTimeout(() => {
                overlay.classList.add('hidden');
                overlay.classList.remove('flex');
                content.classList.remove('modal-leave-active');
            }, 200);
        }

        function switchTab(tab) {
            currentTab = tab;
            const btnFood = document.getElementById('tab-food');
            const btnHome = document.getElementById('tab-homestay');
            const foodFields = document.getElementById('form-food-fields');
            const homeFields = document.getElementById('form-homestay-fields');

            if(tab === 'food') {
                btnFood.className = "flex-1 py-2 rounded-lg bg-white shadow-sm font-medium text-primary text-sm transition-all";
                btnHome.className = "flex-1 py-2 rounded-lg text-textGray font-medium text-sm hover:text-primary transition-all";
                foodFields.classList.remove('hidden');
                homeFields.classList.add('hidden');
            } else {
                btnHome.className = "flex-1 py-2 rounded-lg bg-white shadow-sm font-medium text-primary text-sm transition-all";
                btnFood.className = "flex-1 py-2 rounded-lg text-textGray font-medium text-sm hover:text-primary transition-all";
                homeFields.classList.remove('hidden');
                foodFields.classList.add('hidden');
            }
        }

        function setRating(val) {
            if(document.getElementById('input-visited').value === 'false') return;
            currentRating = val;
            const stars = document.querySelectorAll('#star-group .star');
            stars.forEach((star, index) => {
                if(index < val) star.classList.add('active');
                else star.classList.remove('active');
            });
        }

        function toggleRating() {
            const isVisited = document.getElementById('input-visited').value === 'true';
            const ratingContainer = document.getElementById('rating-container');
            const stars = document.querySelectorAll('#star-group .star');
            
            if(isVisited) {
                ratingContainer.style.opacity = '1';
                if(currentRating === 0) setRating(4); // Mặc định 4 nếu chưa có
                else setRating(currentRating);
            } else {
                ratingContainer.style.opacity = '0.4';
                stars.forEach(s => s.classList.remove('active'));
            }
        }

        // --- XỬ LÝ LƯU (SUBMIT) ---
        function handleFormSubmit(e) {
            e.preventDefault();
            const isVisited = document.getElementById('input-visited').value === 'true';
            
            const newPlaceData = {
                category: currentTab,
                name: document.getElementById('input-name').value,
                address: document.getElementById('input-address').value,
                image: document.getElementById('input-image').value,
                visited: isVisited,
                rating: isVisited ? currentRating : 0,
            };

            if(currentTab === 'food') {
                newPlaceData.type = document.getElementById('input-food-type').value;
                newPlaceData.format = document.getElementById('input-format').value;
            } else {
                newPlaceData.type = document.getElementById('input-home-type').value;
                newPlaceData.price = document.getElementById('input-price').value;
            }

            if (editingId) {
                // ĐANG CHỈNH SỬA
                const index = places.findIndex(p => p.id === editingId);
                if(index !== -1) {
                    places[index] = { ...places[index], ...newPlaceData };
                }
            } else {
                // THÊM MỚI
                newPlaceData.id = Date.now();
                places.push(newPlaceData);
            }

            savePlaces();
            renderPlaces();
            closeFormModal();
        }
    </script>
</body>
</html>
